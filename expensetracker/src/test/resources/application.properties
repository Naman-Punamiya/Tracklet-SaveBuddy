spring.application.name=expensetracker-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
health.check.token=test-health-token

# Password reset test defaults (no real SMTP delivery in tests)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=test@tracklet-savebuddy.local
app.mail.from-name=Tracklet SaveBuddy Test
# Backward-compatible full URL used by existing tests; APP_PASSWORD_RESET_BASE_URL is also supported.
app.reset-password.base-url=
app.reset-password.url=https://example.com/reset-password
app.reset-password.token-expiry-minutes=20
app.reset-password.rate-limit.requests-per-window=3
app.reset-password.rate-limit.window-minutes=15

# Tests may explicitly set forwarded headers; trust by default in tests for deterministic behavior.
app.security.trust-forward-headers=true
