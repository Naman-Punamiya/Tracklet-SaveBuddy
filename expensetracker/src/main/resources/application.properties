spring.application.name=expensetracker
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
health.check.token=${HEALTH_CHECK_TOKEN}
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.address=0.0.0.0
server.port=${PORT:8080}
spring.jpa.open-in-view=false

# Password reset / email (configure via environment variables; never commit secrets)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:${SPRING_MAIL_SMTP_STARTTLS:true}}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SSL_ENABLE:false}
app.mail.from=${APP_MAIL_FROM:}
app.mail.from-name=${APP_MAIL_FROM_NAME:Tracklet SaveBuddy}
# Preferred: configurable reset-link base domain (HTTPS), e.g. https://auth.namanpunamiya.me
# Final reset link becomes: ${app.reset-password.base-url}/reset-password?token=...
app.reset-password.base-url=${APP_PASSWORD_RESET_BASE_URL:}
# Backward-compatible full reset URL (used only when base-url is not set)
app.reset-password.url=${APP_RESET_PASSWORD_URL:}
app.reset-password.token-expiry-minutes=${APP_RESET_PASSWORD_TOKEN_EXPIRY_MINUTES:20}
app.reset-password.rate-limit.requests-per-window=${APP_RESET_PASSWORD_RATE_LIMIT_REQUESTS:3}
app.reset-password.rate-limit.window-minutes=${APP_RESET_PASSWORD_RATE_LIMIT_WINDOW_MINUTES:15}

# Trust X-Forwarded-For/X-Real-IP only when running behind a trusted reverse proxy (e.g. Nginx).
# Keep false when the app is directly reachable to prevent client spoofing of rate-limit IP.
app.security.trust-forward-headers=${APP_SECURITY_TRUST_FORWARD_HEADERS:false}